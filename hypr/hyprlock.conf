background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 8
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(485058ff)
    inner_color = rgba(1b1d20e6)
    font_color = rgb(edf0f3)
    check_color = rgb(79ad9d)
    fail_color = rgb(e4bb80)
    capslock_color = rgb(e4bb80)
    rounding = 10
    font_family = Inter
    fade_on_empty = false
    placeholder_text = Password
    check_text = Authenticating...
    fail_text = $PAMFAIL
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 96
    font_family = Inter
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = rgba(255, 255, 255, 0.75)
    font_size = 16
    font_family = Inter
    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgba(255, 255, 255, 0.6)
    font_size = 11
    font_family = Inter
    position = 0, -170
    halign = center
    valign = center
}
