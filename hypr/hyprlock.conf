background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 8
    brightness = 0.65
    vibrancy = 0.0
    color = rgb(191b1f)
}

input-field {
    monitor =
    size = 280, 52
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(454a54ff)
    inner_color = rgba(191b1ff2)
    font_color = rgb(f0f1f3)
    check_color = rgb(79ad9d)
    fail_color = rgb(e4bb80)
    capslock_color = rgb(e4bb80)
    rounding = 12
    font_family = Inter
    fade_on_empty = false
    placeholder_text = Password
    check_text = Authenticating...
    fail_text = $PAMFAIL
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = <span weight="light">$TIME</span>
    color = rgb(f0f1f3)
    font_size = 96
    font_family = Inter
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = rgb(bdc1ca)
    font_size = 16
    font_family = Inter
    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = rgb(969da9)
    font_size = 11
    font_family = Inter
    position = 0, -170
    halign = center
    valign = center
}
