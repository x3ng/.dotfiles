# ========== 基本 ==========
allow_remote_control no
enable_audio_bell no

cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0
cursor_trail 2
cursor_trail_decay 0.08 0.22
cursor_trail_start_threshold 2

background_opacity 0.65
background_blur 1

window_border_width 0.0
window_margin_width 0.0
# 分屏之间留一点空隙便于区分；不喜欢可改回 0
window_padding_width 6

# Matches the system monospace default. JetBrainsMono Nerd Font Mono is not
# installed, so the old value only worked through fallback.
font_family IosevkaTerm Nerd Font Mono
font_size 12.0

scrollback_lines 50000
copy_on_select clipboard
shell_integration no-cursor

# ========== 分屏（splits 布局）==========
enabled_layouts splits:split_axis=horizontal,stack

map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+b     launch --location=hsplit --cwd=current
map ctrl+shift+z     toggle_layout stack

map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right
# 默认键位：切换窗口 ctrl+shift+[ / ]，关闭窗口 ctrl+shift+w

# ========== 标签栏：纯色块，无渐变 ==========
tab_bar_edge bottom
tab_bar_align center
tab_bar_min_tabs 2
tab_bar_style separator
tab_separator " "
tab_title_template " {index} {title}{activity_symbol} "
# 按序号直达标签
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9
tab_bar_background none

active_tab_foreground   #101010
active_tab_background   #c9c9c9
active_tab_font_style   bold
inactive_tab_foreground #8a8a8a
inactive_tab_background #2e2e2e
inactive_tab_font_style normal

tab_activity_symbol " ●"
bell_on_tab no
