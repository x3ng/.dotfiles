# ========== 基本 ==========
allow_remote_control no
enable_audio_bell no

cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0
cursor_trail 2
cursor_trail_decay 0.12 0.24
cursor_trail_start_threshold 1

background_opacity 0.8
background_blur 1

window_border_width 1.0
window_margin_width 0.0
active_border_color #c2c2c2
inactive_border_color #404040
# 分屏之间留一点空隙便于区分；不喜欢可改回 0
window_padding_width 6

# Matches the system monospace default. JetBrainsMono Nerd Font Mono is not
# installed, so the old value only worked through fallback.
font_family IosevkaTerm Nerd Font Mono
font_size 14.0

scrollback_lines 50000
copy_on_select clipboard
shell_integration no-cursor

# ========== 快捷键：统一使用 Ctrl+Shift，减少记忆负担 ==========
# ========== 分屏（splits 布局）==========
enabled_layouts splits:split_axis=horizontal,stack

# D 创建左右并排的分屏；S 创建上下堆叠的分屏
map ctrl+shift+d     launch --location=vsplit --cwd=current
map ctrl+shift+s     launch --location=hsplit --cwd=current
map ctrl+shift+z     toggle_layout stack

map ctrl+shift+h neighboring_window left
map ctrl+shift+j neighboring_window down
map ctrl+shift+k neighboring_window up
map ctrl+shift+l neighboring_window right
# 默认键位：切换窗口 ctrl+shift+[ / ]，关闭窗口 ctrl+shift+w

# ========== 标签栏：纯色块，无渐变 ==========
tab_bar_edge bottom
tab_bar_align center
tab_bar_min_tabs 2
tab_bar_style separator
tab_separator " "
tab_title_template " {index} {title}{activity_symbol} "
# Ctrl+Shift+数字直达对应标签
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
map ctrl+shift+6 goto_tab 6
map ctrl+shift+7 goto_tab 7
map ctrl+shift+8 goto_tab 8
map ctrl+shift+9 goto_tab 9
tab_bar_background none

active_tab_foreground   #101010
active_tab_background   #f2f2f2
active_tab_font_style   bold
inactive_tab_foreground #c2c2c2
inactive_tab_background #303030
inactive_tab_font_style normal

tab_activity_symbol " ●"
bell_on_tab no

remember_window_size no

# Optional effects (Kitty 0.49+):
# custom_shaders playful
