# ============================================================
# foot 入门配置
#   全部选项与默认值: man foot.ini
#   修改后自检:       foot --check-config -c ~/.config/foot/foot.ini
#
# 注意: 除 [main] 外，配色段必须带 -dark/-light 后缀
#       (foot 1.28 起仍写 [colors] 会报 "invalid section name")
# ============================================================

[main]
# 部分程序按 $TERM 判断能力；foot 默认值是 foot，兼容性一般更好
term=xterm-256color

# ---------- 字体 ----------
# 逗号分隔: 第一个是主字体，其余按顺序做缺字回退（中文、emoji）
font=IosevkaTerm Nerd Font Mono:size=14, Sarasa Mono SC:size=14, Noto Color Emoji:size=14
# dpi-aware 默认 no: 字号随合成器缩放系数放大，和 kitty/wezterm 观感一致
# 若希望不同 DPI 显示器上物理大小一致，改成 yes
# dpi-aware=yes
# 字距 / 行高微调，按需打开
# letter-spacing=0
# line-height=16px

# ---------- 窗口 ----------
# 内边距: 左右x上下
pad=6x6
# 初始窗口大小（字符数），与 initial-window-size-pixels 二选一
initial-window-size-chars=100x28

# ---------- 选区与剪贴板 ----------
# 选中文字自动复制的目标: none | primary | clipboard | both
# primary = 主选择区（中键粘贴），clipboard = 系统剪贴板
selection-target=clipboard

# ---------- 光标 ----------
[cursor]
style=block
unfocused-style=hollow
blink=no

# ---------- 滚动历史 ----------
[scrollback]
lines=50000
# 滚轮速度倍数
multiplier=3.0
# 滚动时右下角位置指示: none | fixed | relative
indicator-position=relative
indicator-format=percentage

# ---------- 鼠标 ----------
[mouse]
hide-when-typing=yes

# ---------- 配色 ----------
# foot 1.28 使用 [colors-dark] / [colors-light]，可用
# color-theme-toggle 快捷键在两者间切换
[colors-dark]
# 背景不透明度 0.0-1.0
alpha=0.85
# 背景模糊: 需要合成器支持 ext-background-effect-v1
# Hyprland 已开启 decoration:blur；若不生效就改成 blur=no
blur=yes
background=000000
foreground=d8d8d8
# 其余颜色沿用内置主题，自定义时补 regular0..7 / bright0..7:
# regular0=000000
# bright0=555555

# ---------- 标题栏 ----------
[csd]
# Hyprland 提供服务端装饰，交给合成器绘制
# 想用 foot 自绘标题栏（可拖动 / 双击最大化）改成 client
preferred=server
font=IosevkaTerm Nerd Font Mono:size=10

# ---------- 快捷键 ----------
[key-bindings]
# foot 没有原生分屏，分屏请用 tmux / zellij
# 以下大多为默认值，列出当速查表
# spawn-terminal=Control+Shift+n
# clipboard-copy=Control+Shift+c
# clipboard-paste=Control+Shift+v
# primary-paste=Shift+Insert
# font-increase=Control+plus Control+equal Control+KP_Add
# font-decrease=Control+minus Control+KP_Subtract
# font-reset=Control+0 Control+KP_0
# search-start=Control+Shift+r
# show-urls-launch=Control+Shift+o
# 关闭窗口（默认未绑定）
quit=Control+Shift+q
