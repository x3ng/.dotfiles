# status bar
set-option -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 20
set -g status-right-length 50
set -g status-left "#[bold] #S "
set -g status-right "#{?window_zoomed_flag,#[dim]Z ,}#[dim]#{pane_current_path} %m-%d #[none,bold,underscore]%H:%M"
set -g status-style "bg=default,fg=default"
set -g window-status-format "#[dim] #I: #W#{?window_panes,(#{window_panes}),} "
set -g window-status-current-format "#[bold,underscore] #I: #W#{?window_panes,(#{window_panes}),} "
set -g window-status-separator ""
set -g pane-border-style "fg=default,dim"
set -g pane-active-border-style "fg=default"
set -g message-style "bg=default,fg=default,reverse"
set -g mode-style "bg=default,fg=default,reverse"

# experience
## prefix bound
unbind C-b
set -g prefix C-space
bind C-space send-prefix
## focus events for claude
set -g focus-events on
## allow OSC passthrough for notifications
set -g allow-passthrough on
set -s set-clipboard external
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
## mouse
set -g mouse on
## vi style copy
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
## buffer history
set -g history-limit 50000
## escape delay
set -g escape-time 0

# pane
## pane index
set -g base-index 1
set -g pane-base-index 1
## pane switch (show numbers, press to jump)
bind p display-panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
## pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
## split window to multi pane
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
## swap pane (within current window, press number)
bind P display-panes -d 0 "swap-pane -t '%%'"
## pane cross-window (lowercase = pane level)
bind g choose-tree -Zw "join-pane -s '%%'"   # get pane
bind m choose-tree -Zw "move-pane -t '%%'"   # move pane out

# window
## create window
bind -r c new-window -c "#{pane_current_path}"
## switch window
bind -r n next-window
bind N previous-window
## window cross-session (uppercase = window level)
bind G choose-tree -Zs "move-window -s '%%'"  # Get window
bind M choose-session -Z "move-window -t '%%'"  # Move window out

# session
## list and switch session
bind s choose-tree -Zs
## create new session
bind C new-session -d -c "#{pane_current_path}" \; switch-client -n

# popup (floating pane, closes on exit)
bind f display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s scratch"

# kill
bind x kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window

# terminal
set -g default-terminal "tmux-256color"
set -g -as terminal-features '*:RGB'
set -g renumber-windows on
