# tmux 配置
#
# prefix = Ctrl+Enter（右手）/ Ctrl+Tab（左手）
# 纯 emacs 风格：Ctrl+b/f/p/n 移动焦点，和 bash/readline 一致。
# prefix 模式内主要使用 Ctrl+组合键，支持按住 Ctrl 连续操作。
# 避开 Ctrl+c/d/z/s：prefix 漏按时可能中断、退出、挂起或暂停输出。
# 双击 prefix 透传给 shell（send-prefix）。
#
# 前提: 终端需支持 extended-keys（foot/kitty/ghostty/wezterm 均支持）。
# 注意: Ctrl+h 在非 extended-keys 终端可能被识别为 backspace。

# ── prefix ────────────────────────────────────────────────────────────────
unbind -a
set -g prefix C-Enter
bind -N "Send Ctrl+Enter to pane (press prefix twice)" C-Enter send-prefix
set -g prefix2 C-Tab
bind -N "Send Ctrl+Tab to pane (press prefix twice)" C-Tab send-prefix -2

# ── 帮助 ──────────────────────────────────────────────────────────────────
bind -N "Show key bindings (q to close)" ? list-keys -N -T prefix -P 'prefix → '
bind -N "Open tmux command prompt" M-x command-prompt

# ── 基础行为 ──────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -s set-clipboard external
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -g default-terminal "tmux-256color"
set -g -as terminal-features '*:RGB'
set -g renumber-windows on

# ── 状态栏 ────────────────────────────────────────────────────────────────
set-option -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-left ""
set -g status-right "#{?pane_in_mode,#[bold] COPY#[default] }#{?pane_synchronized,#[bold] SYNC#[default] }#{?window_zoomed_flag,#[bold] ZOOM#[default] }#{?client_prefix,#[bold] PREFIX #[default],NORM}  #[bold]#S.#I.#P#[default]  %H:%M  %m-%d"
# prefix 生效时整条状态栏反色；按客户端状态计算，退出 prefix 后恢复。
set -g status-style "bg=default,fg=default,#{?client_prefix,reverse,noreverse}"
set -g window-status-format " #I:#W#{?window_panes,(#{window_panes}),} "
set -g window-status-current-style "bold,underscore"
set -g window-status-current-format "#I:#W#{?window_panes,(#{window_panes}),} "
set -g window-status-separator ""
set -g monitor-activity on
set -gw window-status-activity-style "underscore"
set -g pane-border-style "fg=default,dim"
set -g pane-active-border-style "fg=default"
set -g message-style "bg=default,fg=default,reverse"
set -g mode-style "bg=default,fg=default,reverse"

# ── 复制模式（emacs 风格）──────────────────────────────────────────────
set -g mode-keys emacs
bind -N "Enter copy mode (C-Space: select, M-w: copy, Escape: cancel)" C-y copy-mode

# ═══════════════════════════════════════════════════════════════════════════
#  纯 emacs 风格绑定
#
#  焦点移动:  Ctrl+b/f/p/n（和 bash 光标移动一致）
#  窗口切换: Ctrl+h/l（前后）, Ctrl+1~9（跳转）
#  窗口新建: Ctrl+w
#  面板管理: Ctrl+g/v（左右/上下分屏）, Ctrl+x（kill）, Ctrl+r（放大）
#  缩放:     Alt+b/f/p/n（和 Ctrl 区分，用 Alt）
#  布局:     Ctrl+[/]
#  浮动:     Ctrl+e
# ═══════════════════════════════════════════════════════════════════════════

# ── 焦点移动（Ctrl+b/f/p/n，和 bash 一致）──────────────────────────────
bind -r -N "Select pane left" C-b select-pane -L
bind -r -N "Select pane right" C-f select-pane -R
bind -r -N "Select pane above" C-p select-pane -U
bind -r -N "Select pane below" C-n select-pane -D

# ── 缩放（Alt+b/f/p/n）─────────────────────────────────────────────────
bind -r -N "Resize pane left" M-b resize-pane -L 5
bind -r -N "Resize pane right" M-f resize-pane -R 5
bind -r -N "Resize pane up" M-p resize-pane -U 5
bind -r -N "Resize pane down" M-n resize-pane -D 5

# ── 窗口切换 ──────────────────────────────────────────────────────────────
bind -r -N "Previous window" C-h previous-window
bind -r -N "Next window" C-l next-window
# 裸键和 Ctrl+数字均可；跳转后立即退出 prefix，避免吞掉接下来的数字输入。
bind -N "Select window 1" 1 select-window -t 1
bind -N "Select window 2" 2 select-window -t 2
bind -N "Select window 3" 3 select-window -t 3
bind -N "Select window 4" 4 select-window -t 4
bind -N "Select window 5" 5 select-window -t 5
bind -N "Select window 6" 6 select-window -t 6
bind -N "Select window 7" 7 select-window -t 7
bind -N "Select window 8" 8 select-window -t 8
bind -N "Select window 9" 9 select-window -t 9
bind -N "Select window 1" C-1 select-window -t 1
bind -N "Select window 2" C-2 select-window -t 2
bind -N "Select window 3" C-3 select-window -t 3
bind -N "Select window 4" C-4 select-window -t 4
bind -N "Select window 5" C-5 select-window -t 5
bind -N "Select window 6" C-6 select-window -t 6
bind -N "Select window 7" C-7 select-window -t 7
bind -N "Select window 8" C-8 select-window -t 8
bind -N "Select window 9" C-9 select-window -t 9

# ── 分屏 ──────────────────────────────────────────────────────────────────
bind -N "Split pane left/right (current directory)" C-g split-window -h -c "#{pane_current_path}"
bind -N "Split pane top/bottom (current directory)" C-v split-window -v -c "#{pane_current_path}"

# ── 窗口管理 ──────────────────────────────────────────────────────────────
# 新建窗口不允许重复触发；Ctrl+w 在 shell 中通常是可撤销的删词。
bind -N "New window (current directory)" C-w new-window -c "#{pane_current_path}"
bind -N "Kill window (confirm)" M-w confirm-before -p "kill window #W? (y/n)" kill-window
bind -N "Toggle synchronized pane input" M-s set-window-option synchronize-panes \; \
    display-message "sync: #{?pane_synchronized,ON,OFF}"
bind -N "Toggle pane zoom" C-r resize-pane -Z

# ── 布局 ──────────────────────────────────────────────────────────────────
bind -N "Next layout" C-[ next-layout
bind -N "Previous layout" C-] previous-layout

# ── detach ────────────────────────────────────────────────────────────────
bind -N "Detach client (keep session running)" C-k detach-client

# ── 跨 session 操作 ───────────────────────────────────────────────────────
bind -N "Choose pane to join current window" M-g choose-tree -Zw "join-pane -s '%%'"    # get pane
bind -N "Choose window to move into current session" M-m choose-tree -Zs "move-window -s '%%'"  # move window
bind -N "Choose session, window or pane" C-a choose-tree -Zs                         # switch session
# 从按键绑定创建时直接切入新 session，不能用 switch-client -n 猜测目标。
bind -N "New session and switch to it (current directory)" C-o new-session -c "#{pane_current_path}"

# ── 永久删除 pane（带确认）───────────────────────────────────────────────
bind -N "Kill pane (confirm)" C-x confirm-before -p "kill pane? (y/n)" kill-pane

# ── 浮动面板 ──────────────────────────────────────────────────────────────
bind -N "Open shared scratch session in popup" C-e display-popup -d "#{pane_current_path}" -w 80% -h 80% -E \
    "tmux new-session -A -s __scratch__"

# ── display-panes（显示编号，按数字交换 pane）────────────────────────────
bind -N "Show pane numbers and swap with selected pane" C-t display-panes -d 0 "swap-pane -t '%%'"
