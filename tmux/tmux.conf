# status bar
set-option -g status-position top
set -g status-left "#S:#I:#P|"
set -g status-right "#{?window_zoomed_flag,[ZOOM],}|#{pane_current_path}|%H:%M|%m-%d"

# experience
## prefix bound
unbind C-b
set -g prefix C-space
bind C-space send-prefix
## focus events for claude
set -g focus-events on
## allow OSC passthrough for notifications
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
## mouse
set -g mouse on
## vi style copy
set -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
## buffer history
set -g history-limit 50000
## escape delay
set -g escape-time 0

# pane
## pane index
set -g base-index 1
set -g pane-base-index 1
## pane switch (show numbers, press to jump)
bind p display-panes
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
## pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
## split window to multi pane
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
## swap pane (show numbers, press to swap)
bind P display-panes -d 0 "swap-pane -t '%%'"
## break/join pane
bind @ command-prompt -p "join pane from (win.pane):" "join-pane -s '%%'"

# window
## create window
bind -r c new-window -c "#{pane_current_path}"
## switch window
bind -r n next-window
bind N previous-window

# session
## list and switch session
bind s choose-tree -Zs

# kill
bind x kill-pane
bind X confirm-before -p "kill window #W? (y/n)" kill-window

# color
set -g default-terminal "tmux-256color"
set -g -as terminal-features '*:RGB'
set -g renumber-windows on
