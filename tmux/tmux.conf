# tmux 配置
#
# prefix = Ctrl+\（右手）/ Ctrl+Tab（左手）
# 纯 emacs 风格：Ctrl+b/f/p/n 移动焦点，和 bash/readline 一致。
# prefix 模式内所有动作为 Ctrl+组合键，无裸单键。
# 双击 prefix 透传给 shell（send-prefix）。
#
# 前提: 终端需支持 extended-keys（foot/kitty/ghostty/wezterm 均支持）。
# 注意: Ctrl+h 在非 extended-keys 终端可能被识别为 backspace。

# ── prefix ────────────────────────────────────────────────────────────────
unbind -a
set -g prefix C-\\
bind C-\\ send-prefix
set -g prefix2 C-Tab
bind C-Tab send-prefix -2

# ── 帮助 ──────────────────────────────────────────────────────────────────
bind ? list-keys
bind M-x command-prompt

# ── 基础行为 ──────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g escape-time 0
set -g focus-events on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM
set -s set-clipboard external
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -g default-terminal "tmux-256color"
set -g -as terminal-features '*:RGB'
set -g renumber-windows on

# ── 状态栏 ────────────────────────────────────────────────────────────────
set-option -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 80
set -g status-left ""
set -g status-right "#{?pane_in_mode,#[bold] COPY#[default] }#{?pane_synchronized,#[bold] SYNC#[default] }#{?window_zoomed_flag,#[bold] ZOOM#[default] }#{?client_prefix,PREF,NORM}  #[bold]#S.#I.#P#[default]  %H:%M  %m-%d"
set -g status-style "bg=default,fg=default"
set -g window-status-format " #I:#W#{?window_panes,(#{window_panes}),} "
set -g window-status-current-style "bold,underscore"
set -g window-status-current-format "#I:#W#{?window_panes,(#{window_panes}),} "
set -g window-status-separator ""
set -g monitor-activity on
set -gw window-status-activity-style "underscore"
set -g pane-border-style "fg=default,dim"
set -g pane-active-border-style "fg=default"
set -g message-style "bg=default,fg=default,reverse"
set -g mode-style "bg=default,fg=default,reverse"

# ── 复制模式（emacs 风格）──────────────────────────────────────────────
set -g mode-keys emacs
bind C-y copy-mode

# ═══════════════════════════════════════════════════════════════════════════
#  纯 emacs 风格绑定
#
#  焦点移动:  Ctrl+b/f/p/n（和 bash 光标移动一致）
#  窗口切换: Ctrl+h/l（前后）, Ctrl+1~9（跳转）
#  面板管理: Ctrl+d（新建）, Ctrl+x（kill）
#  缩放:     Alt+b/f/p/n（和 Ctrl 区分，用 Alt）
#  布局:     Ctrl+[/]
#  浮动:     Ctrl+e
# ═══════════════════════════════════════════════════════════════════════════

# ── 焦点移动（Ctrl+b/f/p/n，和 bash 一致）──────────────────────────────
bind -r C-b select-pane -L
bind -r C-f select-pane -R
bind -r C-p select-pane -U
bind -r C-n select-pane -D

# ── 缩放（Alt+b/f/p/n）─────────────────────────────────────────────────
bind -r M-b resize-pane -L 5
bind -r M-f resize-pane -R 5
bind -r M-p resize-pane -U 5
bind -r M-n resize-pane -D 5

# ── 窗口切换 ──────────────────────────────────────────────────────────────
bind -r C-h previous-window
bind -r C-l next-window
# 数字区不和输入法冲突，裸键和 Ctrl+数字均可
bind -r 1 select-window -t 1
bind -r 2 select-window -t 2
bind -r 3 select-window -t 3
bind -r 4 select-window -t 4
bind -r 5 select-window -t 5
bind -r 6 select-window -t 6
bind -r 7 select-window -t 7
bind -r 8 select-window -t 8
bind -r 9 select-window -t 9
bind -r C-1 select-window -t 1
bind -r C-2 select-window -t 2
bind -r C-3 select-window -t 3
bind -r C-4 select-window -t 4
bind -r C-5 select-window -t 5
bind -r C-6 select-window -t 6
bind -r C-7 select-window -t 7
bind -r C-8 select-window -t 8
bind -r C-9 select-window -t 9

# ── 分屏 ──────────────────────────────────────────────────────────────────
bind C-d split-window -h -c "#{pane_current_path}"
bind C-v split-window -v -c "#{pane_current_path}"

# ── 窗口管理 ──────────────────────────────────────────────────────────────
bind -r C-c new-window -c "#{pane_current_path}"
bind M-w confirm-before -p "kill window #W? (y/n)" kill-window
bind M-s set-window-option synchronize-panes \; \
    display-message "sync: #{?pane_synchronized,ON,OFF}"
bind C-z resize-pane -Z

# ── 布局 ──────────────────────────────────────────────────────────────────
bind C-[ next-layout
bind C-] previous-layout

# ── detach ────────────────────────────────────────────────────────────────
bind C-k detach-client

# ── 跨 session 操作 ───────────────────────────────────────────────────────
bind C-g choose-tree -Zw "join-pane -s '%%'"    # get pane
bind C-w choose-tree -Zs "move-window -s '%%'"  # get window
bind C-s choose-tree -Zs                         # switch session
bind C-o new-session -d -c "#{pane_current_path}" \; switch-client -n

# ── 永久删除 pane（带确认）───────────────────────────────────────────────
bind C-x confirm-before -p "kill pane? (y/n)" kill-pane

# ── 浮动面板 ──────────────────────────────────────────────────────────────
bind C-e display-popup -d "#{pane_current_path}" -w 80% -h 80% -E \
    "tmux new-session -A -s __scratch__"

# ── display-panes（显示编号，按数字交换 pane）────────────────────────────
bind C-t display-panes -d 0 "swap-pane -t '%%'"
