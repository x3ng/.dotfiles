"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

[directory]
truncation_length = 5
truncate_to_repo = true

[time]
disabled = false
format = '[$time]($style) '

[cmd_duration]
min_time = 1500

[status]
disabled = false

[battery]
display = [
  { threshold = 20, style = "bold red" },
  { threshold = 50, style = "bold yellow" },
]
