# fcitx5 Classic UI 皮肤（静态：只有 fcitx5-configtool 会改写这个文件）
# 主题包由 nix 安装，可选项见 ~/.nix-profile/share/fcitx5/themes/
#   mellow: graphite / sakura / vermilion / wechat / youlan（每个都有 -dark）
#   fluent: FluentLight / FluentDark（另有 -solid 不透明变体）
# 换主题：改这里的 Theme=/DarkTheme= 后重启 fcitx5（fcitx5 -r）
Theme=mellow-graphite
DarkTheme=mellow-graphite-dark
UseDarkTheme=True
