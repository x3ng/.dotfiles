#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [ 2, 4, 4 ]
sort_by = "natural"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"
show_hidden = true
show_symlink = true

[preview]
tab_size = 2
max_width = 1200
max_height = 1800

[opener]
edit = [
  { run = '${EDITOR:-vi} %s', block = true, desc = "Editor ($EDITOR)", for = "unix" },
]
open = [
  { run = 'xdg-open %s1', orphan = true, desc = "Open (xdg-open)", for = "linux" },
]

[open]
# Extend the defaults instead of sending images, PDFs and archives to $EDITOR.
# Preserve built-in extraction, media, trash and remote-file actions.
prepend_rules = [
  { mime = "text/*", use = [ "edit", "open", "reveal" ] },
  { mime = "application/{json,ndjson,javascript,toml,yaml,x-yaml,xml}", use = [ "edit", "open", "reveal" ] },
]

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"

# Keep native image/PDF/video/archive previews; render only local Markdown.
[[plugin.prepend_previewers]]
url = "local://*.{md,markdown,mdown,mkd}"
run = 'piper -- CLICOLOR_FORCE=1 glow -w="$w" -s="$([ "$t" = light ] && echo light || echo dark)" "$1"'
